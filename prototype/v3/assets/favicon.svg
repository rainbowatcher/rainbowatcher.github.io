<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- 品牌标记：纸面上的一条细光谱线，页头不再放彩虹图标 -->
    <defs>
        <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="hsl(6 50% 62%)" />
            <stop offset="0.18" stop-color="hsl(28 52% 60%)" />
            <stop offset="0.34" stop-color="hsl(48 42% 57%)" />
            <stop offset="0.5" stop-color="hsl(140 25% 53%)" />
            <stop offset="0.67" stop-color="hsl(190 38% 53%)" />
            <stop offset="0.84" stop-color="hsl(216 36% 61%)" />
            <stop offset="1" stop-color="hsl(276 22% 63%)" />
        </linearGradient>
    </defs>
    <rect width="32" height="32" fill="hsl(200 32% 97%)" />
    <rect x="4" y="11" width="24" height="2" fill="hsl(203 34% 21%)" />
    <rect x="4" y="16" width="24" height="3" fill="url(#spectrum)" />
    <rect x="4" y="22" width="24" height="1" fill="hsl(202 24% 86%)" />
