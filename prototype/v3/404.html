        <script>
            ;(function () {
                var d = document.documentElement
                d.classList.add("has-js", "m-enter")
                var saved = null
                try {
                    saved = localStorage.getItem("prototypeTheme")
                } catch (e) {}
                var forced = new URLSearchParams(window.location.search).get("theme")
                var theme = "light"
                if (forced === "light" || forced === "dark") theme = forced
                else if (saved === "light" || saved === "dark") theme = saved
                d.dataset.theme = theme
                var scale = 1
                try {
                    var value = parseFloat(localStorage.getItem("prototypeArticleScale"))
                    if (isFinite(value) && value >= 0.9 && value <= 1.2) scale = value
                } catch (e) {}
                d.style.setProperty("--article-scale", String(scale))
            })()
        </script>
